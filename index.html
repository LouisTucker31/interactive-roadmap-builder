<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ex HAILSTORM</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/styles.css">
<script>
// Set the theme before first paint so dark mode doesn't flash light on load.
(function () {
  var saved;
  try { saved = localStorage.getItem('theme'); } catch (e) {}
  var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
})();
</script>
</head>
<body>
<div class="app" data-canvas-width="1440" data-canvas-height="900" data-document-role="page" data-label="Gantt planner">

<header class="top">
<nav class="crumb" aria-label="Breadcrumb">
<span class="ws">Workspace</span><span class="sep">/</span><span class="name">Ex HAILSTORM</span>
<div class="tagwrap"><button class="pill" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="tag-pop" data-tag-btn></button><div class="tagpop" id="tag-pop" role="dialog" aria-label="Project tag" hidden data-tag-pop></div></div>
</nav>
<div class="tools">
<button class="btn" type="button" disabled=""><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4 4-6 8-6s8 2 8 6"></path></svg><span class="lbl">My tasks</span></button>
<div class="search" data-search><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg><input type="text" placeholder="Search" aria-label="Search the plan" autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-results" data-search-input><span class="kbd" data-search-kbd>⌘F</span><div class="sresults" id="search-results" role="listbox" aria-label="Search results" hidden data-search-results></div></div>
<div class="grp">
<button type="button" disabled="" aria-label="Undo" title="Undo (Ctrl+Z)" data-undo><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14L4 9l5-5"></path><path d="M4 9h11a5 5 0 010 10h-3"></path></svg></button>
<button type="button" aria-label="Redo" title="Redo (Ctrl+Y)" disabled="" data-redo><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14l5-5-5-5"></path><path d="M20 9H9a5 5 0 000 10h3"></path></svg></button>
</div>
<button class="btn" type="button" disabled="">Actions<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width: 11px; height: 11px"><path d="M6 9l6 6 6-6"></path></svg></button>
<div class="stack" hidden data-people-stack></div>
<button class="primary" type="button" aria-haspopup="dialog" data-new-task><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>New task</button>
</div>
</header>

<main class="panel">
<nav class="rail" aria-label="Views">
<div class="logo" aria-hidden="true">P</div>
<button class="ri on" type="button" aria-label="Timeline" title="Timeline" aria-current="page" data-page-btn="timeline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M7 12h13M4 18h9"></path></svg></button>
<button class="ri" type="button" aria-label="List" title="List" data-page-btn="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
<button class="ri" type="button" disabled="" aria-label="Calendar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M8 3v4M16 3v4M4 10h16"></path></svg></button>
<button class="ri" type="button" aria-label="Board" title="Board" data-page-btn="board"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="4.5" height="16" rx="1"></rect><rect x="10" y="4" width="4.5" height="11" rx="1"></rect><rect x="16" y="4" width="4" height="14" rx="1"></rect></svg></button>
<button class="ri" type="button" disabled="" aria-label="Workload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3"></circle><path d="M3 19c0-3 2.5-5 5-5s5 2 5 5M15 11h6M15 15h6M17 19h4"></path></svg></button>
<button class="ri" type="button" disabled="" aria-label="Reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"></rect><path d="M9 3h6v3H9zM9 16v-3M12 16v-5M15 16v-2"></path></svg></button>
<button class="ri" type="button" disabled="" aria-label="Trash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"></path></svg></button>
<div class="spacer"></div>
<span class="av" style="background: #dfae2f">DV</span>
<button class="ri" type="button" aria-label="Dark mode" aria-pressed="false" data-theme-toggle><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"></path></svg><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg></button>
<button class="ri" type="button" disabled="" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"></path></svg></button>
</nav>

<aside class="gut" aria-label="Task list" data-panel>
<div class="gut-hd">
<span class="gut-title">Task</span>
<button class="caret" type="button" aria-expanded="false" aria-controls="task-list" aria-label="Show task list" title="Show task list" data-panel-toggle><svg viewBox="0 0 24 24" width="9" height="9" fill="currentColor" aria-hidden="true"><path d="M8 5l10 7-10 7z"></path></svg></button>
</div>
<div class="gut-body" id="task-list"><div class="gut-rows" data-task-rows></div></div>
</aside>

<div class="scroll">
<div class="chart">
<div class="hd">
<div class="groups" data-groups></div>
<div class="cols" data-cols></div>
</div>

<div class="body">
<div class="rows"></div>
<div class="mlines" data-mlines></div>
<div class="dock"><button class="today" type="button" data-today>← Today</button></div>

<!-- Plan rows and dependency arrows are drawn from js/data.js by js/app.js; phase bands sit behind them -->
<div class="bands" data-bands></div>
<svg class="deps" aria-hidden="true">
<defs><marker id="ah" viewBox="0 0 8 8" refX="4" refY="7" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L4 7L7 1" fill="none" stroke="#9aa3ad" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></marker></defs>
<g fill="none" stroke="#b3bbc4" stroke-width="1.1" stroke-linecap="square" data-deps></g>
</svg>
<div class="plan" data-plan></div>
<div class="ghost" hidden data-ghost><span></span></div>
</div>
</div>
</div>

<!-- List view: the same plan as a table, laid over the timeline. Rows and menus are filled in by js/app.js -->
<section class="list" aria-label="List" data-list>
<div class="ltools">
<label class="lsearch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg><input type="search" placeholder="Filter by name" aria-label="Filter by name" autocomplete="off" data-lf="q"></label>
<select aria-label="Type" data-lf="type"><option value="">All types</option><option value="task">Tasks</option><option value="milestone">Milestones</option><option value="phase">Phases</option></select>
<select aria-label="Status" data-lf="status"><option value="">Any status</option><option value="open">Not started</option><option value="active">In progress</option><option value="done">Done</option></select>
<select aria-label="Phase" data-lf="phase"></select>
<select aria-label="Person" data-lf="person"></select>
<button class="lclear" type="button" hidden data-lf-clear>Clear filters</button>
<span class="lcount" data-list-count></span>
<div class="cwrap">
<button class="btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="cols-menu" data-cols-btn><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"></rect><path d="M10 4v16M15 4v16"></path></svg>Columns<b class="hcount" hidden data-hidden-count></b></button>
<div class="zmenu cmenu" id="cols-menu" hidden data-cols-menu></div>
</div>
</div>
<div class="lscroll">
<table class="ltable">
<thead data-list-head></thead>
<tbody data-list-body></tbody>
</table>
</div>
</section>

<!-- Board view: the plan as a kanban, laid over the timeline. Columns and cards are filled in by js/app.js -->
<section class="board" aria-label="Board" data-board>
<div class="ltools btools">
<span class="blbl">Columns</span>
<div class="bseg" role="group" aria-label="Group cards by" data-board-group><button type="button" data-group-by="status">Status</button><button type="button" data-group-by="phase">Phase</button><button type="button" data-group-by="person">Person</button><button type="button" data-group-by="day">Day</button></div>
<button class="btn btog" type="button" aria-pressed="true" data-board-subtasks>Subtasks</button>
<span class="blbl">Width</span>
<div class="bseg" role="group" aria-label="Card width" data-board-width><button type="button" data-width="comfortable">Comfortable</button><button type="button" data-width="compact">Compact</button></div>
<span class="lcount" data-board-count></span>
<div class="cwrap">
<button class="btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="show-menu" data-show-btn><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>Show<b class="hcount" hidden data-show-count></b></button>
<div class="zmenu cmenu" id="show-menu" hidden data-show-menu></div>
</div>
</div>
<div class="bscroll"><div class="bcols" data-board-cols></div></div>
</section>
</main>

<footer class="foot">
<div class="l"><span data-stat="tasks"></span><span class="dot">·</span><span data-stat="milestones"></span><span class="dot">·</span><span data-stat="phases"></span><span class="dot">·</span><span>All days</span><span class="dot">·</span><span>Auto-schedule</span></div>
<div class="r">
<button class="ib" type="button" aria-label="Full screen" aria-pressed="false" data-fullscreen><svg class="i-enter" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg><svg class="i-exit" viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"></path></svg></button>
<button class="ib" type="button" aria-label="Zoom out" data-zoom-out>−</button>
<div class="zwrap">
<button class="zoom" type="button" aria-label="Zoom level" aria-haspopup="menu" aria-expanded="false" aria-controls="zoom-menu" data-zoom-label>80%</button>
<div class="zmenu" id="zoom-menu" role="menu" aria-label="Zoom" hidden data-zoom-menu></div>
</div>
<button class="ib" type="button" aria-label="Zoom in" data-zoom-in>+</button>
<div class="seg" role="group" aria-label="Scale">
<button type="button" data-scale="H" aria-pressed="false" title="Hour">H</button><button type="button" data-scale="D" aria-pressed="false" title="Day">D</button><button type="button" data-scale="W" class="on" aria-pressed="true" title="Week">W</button><button type="button" data-scale="M" aria-pressed="false" title="Month">M</button><button type="button" data-scale="Q" aria-pressed="false" title="Quarter">Q</button><button type="button" data-scale="Y" aria-pressed="false" title="Year">Y</button>
</div>
</div>
</footer>

</div>

<!-- New task form. Options (colours, phases, parents, dependencies) are filled in by js/app.js -->
<dialog class="dlg" aria-labelledby="nt-title" data-new-dialog>
<form method="dialog" novalidate data-new-form>
<div class="dlg-hd">
<h2 id="nt-title" data-nt-title>New task</h2>
<button class="x" type="button" aria-label="Close" data-nt-close><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div class="dlg-body">
<div class="kind" role="radiogroup" aria-label="Type">
<label><input type="radio" name="type" value="task" checked><span>Task</span></label><label><input type="radio" name="type" value="milestone"><span>Milestone</span></label><label><input type="radio" name="type" value="phase"><span>Phase</span></label>
</div>

<label class="fld"><span class="fl">Name</span><input type="text" name="name" maxlength="80" autocomplete="off" placeholder="e.g. Billing page" required></label>

<div class="when">
<div class="fld"><span class="fl" data-start-label>Start</span><div class="dt"><input type="date" name="startDate" aria-label="Start date" required><input type="time" name="startTime" aria-label="Start time" value="09:00" data-time></div></div>
<div class="fld"><span class="fl"><span data-end-label>Finish</span><button class="clr" type="button" hidden data-end-clear>Clear</button></span><div class="dt"><input type="date" name="endDate" aria-label="Finish date"><input type="time" name="endTime" aria-label="Finish time" value="17:00" data-time></div></div>
</div>
<label class="chk"><input type="checkbox" name="allDay" checked> All day</label>
<div class="fld" data-for="task"><span class="fl">Colour</span><div class="swatches" role="radiogroup" aria-label="Colour" data-colors></div></div>
<div class="fld"><span class="fl">Person</span>
<div class="people-pick" data-people></div>
<div class="pp-sel" data-person-sel></div>
<div class="newp" hidden data-new-person>
<div class="newp-row"><input type="text" name="newPerson" maxlength="60" placeholder="Their name" autocomplete="off" aria-label="Person's name"><button class="primary" type="button" data-add-person>Add</button><button class="btn" type="button" data-cancel-person>Cancel</button></div>
<div class="newp-row"><div class="pcolors" role="radiogroup" aria-label="Avatar colour" data-person-colors></div></div>
</div>
</div>

<div class="two">
<label class="fld" data-for="task milestone"><span class="fl">Phase</span><select name="phase" data-phases></select></label>
<label class="fld" data-for="task"><span class="fl">Subtask of</span><select name="parent" data-parents></select></label>
</div>

<div class="fld" data-for="task"><span class="fl">Progress <output data-progress-out>0%</output></span><input type="range" name="progress" min="0" max="100" step="5" value="0" aria-label="Progress"></div>

<div class="fld" data-for="task milestone"><button class="fold" type="button" aria-expanded="false" aria-controls="dep-options" data-deps-toggle><svg viewBox="0 0 24 24" width="9" height="9" fill="currentColor" aria-hidden="true"><path d="M8 5l10 7-10 7z"></path></svg><span class="fl">Depends on <em>can't start until these finish</em></span><span class="fold-n" data-deps-count></span></button><div class="deps-list" id="dep-options" hidden data-dep-options></div></div>

<p class="err" role="alert" data-nt-error hidden></p>
</div>
<div class="dlg-ft">
<button class="btn del" type="button" hidden data-nt-delete>Delete</button>
<button class="btn" type="button" data-nt-close>Cancel</button>
<button class="primary" type="submit" data-nt-submit>Create task</button>
</div>
</form>
</dialog>

<!-- Item details, shown when a bar, milestone or phase is clicked in the chart. Filled in by js/app.js -->
<div class="peek" role="dialog" aria-labelledby="peek-title" hidden data-peek>
<div class="peek-hd">
<i data-peek-icon></i>
<div class="peek-tt"><span class="peek-kind" data-peek-kind></span><h3 id="peek-title" data-peek-title></h3></div>
<button class="x" type="button" aria-label="Close" data-peek-close><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<dl class="peek-body" data-peek-body></dl>
<div class="peek-ft"><button class="btn" type="button" data-peek-edit><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path><path d="M13 7l4 4"></path></svg>Edit</button></div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
